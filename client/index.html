<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck Mail</title>
    <link rel="stylesheet" href="https://unpkg.com/98.css">
    <link rel="icon" href="assets/favicon.png" type="image/png">
</head>
<body style="background-color:#008080; padding: 20px; font-family: 'MS Sans Serif', Arial, sans-serif;">

  <img src="assets/favicon.png" alt="logo" style="display: block; margin: 0 auto 20px; width: 64px; height: 64px;">

<div class="window" style="width: 350px; margin: 0 auto;">
  <div class="title-bar">
    <div class="title-bar-text">Duck Mail - Login</div>
    <div class="title-bar-controls">
      <button aria-label="Minimize"></button>
      <button aria-label="Maximize"></button>
      <button aria-label="Close"></button>
    </div>
  </div>
  
  <div class="window-body">
    <p>Enter your credentials to access your mailbox.</p>
    
    <form action="/login" method="POST">
      <div class="field-row-stacked" style="width: 280px">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="quack@example.com" required />
      </div>

      <div class="field-row-stacked" style="width: 280px; margin-top: 10px;">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required />
      </div>

      <div class="field-row" style="justify-content: flex-end; margin-top: 20px;">
        <button id="submitBtn" type="submit">OK</button>
        <button type="button" onclick="close_window()">Cancel</button>
      </div>
    </form>
  </div>

  <div class="status-bar">
    <p class="status-bar-field">Press OK to continue</p>
    <p class="status-bar-field">CPU Usage: 2%</p>
  </div>
</div>

<p style="text-align: center; margin-top: 20px; color: #fff;">Don't have an account? <a href="auth/signup.html" style="color: #fff; text-decoration: underline;">Sign up here</a></p>
<p style="text-align: center; margin-top: 20px; color: #fff;">© 2026 Duck Mail Inc. All rights reserved.</p>

<audio id="duckSound" src="assets/duck.mp3"></audio>
<script src="js/client.js"></script>
<script src="js/closewindow.js"></script>

</body>
</html>
